name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Astro type check
        run: npm run check
      - name: Astro build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
